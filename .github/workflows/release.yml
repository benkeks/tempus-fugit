name: Deploy Itch

on:
  release:
    types: [published]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest # Base Image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Get code from repo
      - name: Setup Node.js
        uses: actions/setup-node@v4 # Install Node.JS
        with:
          node-version: 20.x # Use any major version 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install # Install dependencies
      - name: Build project
        run: npm run build # Compile Code
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 2
  deploy:
    name: Upload to Itch
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clave
          path: build/clave
      - uses: manleydev/butler-publish-itchio-action@v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          PACKAGE: build/tempusfugit
          VERSION: 1.0.0
          ITCH_USER: benkeks
          ITCH_GAME: tempusfugit
